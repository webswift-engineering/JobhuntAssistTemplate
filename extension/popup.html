<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 460px; margin: 0; font: 13px -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e6e9ef; }
      header { padding: 10px 12px; border-bottom: 1px solid #2a2f3a; display: flex; align-items: center; gap: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ecf8e; }
      .dot.off { background: #ff6b6b; }
      h1 { font-size: 14px; margin: 0; flex: 1; }
      .bar { padding: 8px 12px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #2a2f3a; }
      select, button, input { background: #1e222b; color: #e6e9ef; border: 1px solid #2a2f3a; border-radius: 6px; padding: 5px 8px; font: inherit; }
      button { cursor: pointer; }
      table { width: 100%; border-collapse: collapse; }
      td, th { padding: 6px 8px; border-bottom: 1px solid #20242d; text-align: left; vertical-align: top; }
      th { color: #8b93a7; font-size: 11px; text-transform: uppercase; }
      .title { font-weight: 600; }
      .muted { color: #8b93a7; font-size: 11.5px; }
      .acts button { padding: 3px 6px; font-size: 11px; margin-right: 3px; }
      #list { max-height: 380px; overflow: auto; }
      .empty { padding: 30px; text-align: center; color: #8b93a7; }
      a { color: #5b8cff; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot off"></span>
      <h1>Job Capture</h1>
      <button id="open-copilot" title="Answers + résumé beside any application form">🧭 Copilot</button>
      <a id="open-dash" href="http://127.0.0.1:8787" target="_blank">Dashboard ↗</a>
    </header>
    <div class="bar">
      <label class="muted" title="On every career site: tap a text box for your name/email/answers, tap Upload to attach this job's résumé. Login, Next, and Submit stay yours."><input type="checkbox" id="assist-everywhere" /> Field helper on every site</label>
      <span id="assist-status" class="muted"></span>
    </div>
    <details id="settings" style="border-bottom:1px solid #2a2f3a;">
      <summary id="settings-summary" style="padding:8px 12px; cursor:pointer; color:#8b93a7;">⚙ Backend settings</summary>
      <div style="padding:8px 12px; display:flex; flex-direction:column; gap:6px;">
        <label class="muted">Backend URL
          <input id="backend-url" type="text" style="width:100%; margin-top:3px;" placeholder="http://127.0.0.1:8787" />
        </label>
        <label class="muted">Access token (only if you set one)
          <input id="access-token" type="password" style="width:100%; margin-top:3px;" placeholder="leave blank for localhost" />
        </label>
        <button id="save-settings">Save & test</button>
        <span id="settings-status" class="muted"></span>
      </div>
    </details>
    <details id="autoscan" style="border-bottom:1px solid #2a2f3a;">
      <summary style="padding:8px 12px; cursor:pointer; color:#8b93a7;">⏰ LinkedIn auto-scan</summary>
      <div style="padding:8px 12px; display:flex; flex-direction:column; gap:6px;">
        <label class="muted"><input type="checkbox" id="auto-enabled" /> scan on a schedule</label>
        <label class="muted">LinkedIn search URL (open your filtered search while logged in, copy the URL)
          <input id="auto-url" type="text" style="width:100%; margin-top:3px;" placeholder="https://www.linkedin.com/jobs/search/?keywords=…&f_TPR=r86400…" />
        </label>
        <div class="muted" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          every <input id="auto-interval" type="number" min="30" max="720" step="15" style="width:58px;" /> min,
          <input id="auto-start" type="number" min="0" max="23" style="width:44px;" />:00–<input id="auto-end" type="number" min="1" max="24" style="width:44px;" />:00
          <select id="auto-days">
            <option value="1,2,3,4,5">weekdays</option>
            <option value="1,2,3,4,5,6">Mon–Sat</option>
            <option value="0,1,2,3,4,5,6">every day</option>
          </select>
        </div>
        <label class="muted" title="First run of the day scans the past 24h (3 pages); later runs only the last ~2× interval (2 pages). Off = always scan the URL exactly as pasted."><input type="checkbox" id="auto-smart" /> smart time range (24h catch-up, then incremental)</label>
        <div style="display:flex; gap:6px; align-items:center;">
          <button id="auto-save">Save</button>
          <button id="auto-run-now">Run now</button>
          <span id="auto-status" class="muted"></span>
        </div>
        <span id="auto-last" class="muted"></span>
        <div style="border-top:1px solid #2a2f3a; margin-top:4px; padding-top:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <label class="muted" title="Jobs you queue for apply (phone or dashboard) are opened here in a background window, filled by the apply engine and parked — never submitted. The phone shows the filled fields and the open questions."><input type="checkbox" id="prefill-enabled" /> 📱 prefill-ahead (fill queued jobs in a background window)</label>
          <button id="prefill-now" title="Poll the backend now instead of waiting for the next minute">Prefill now</button>
          <span id="prefill-status" class="muted"></span>
        </div>
      </div>
    </details>
    <div class="bar">
      <button id="scan">⌕ Scan this page</button>
      <button id="reteach" title="Re-learn this site's layout with AI">✨ AI re-teach</button>
      <button id="copysrc" title="Copy the page structure to share for analysis">⧉ Copy structure</button>
      <span id="scan-status" class="muted"></span>
    </div>
    <div class="bar">
      <label class="muted"><input type="checkbox" id="hide-disq" /> hide skips</label>
      <label class="muted"><input type="checkbox" id="save-scanned" checked /> save matches</label>
    </div>
    <div class="bar">
      <select id="filter">
        <option value="">All states</option>
        <option value="discovered">Discovered</option>
        <option value="relevant">Relevant</option>
        <option value="notified">Notified</option>
        <option value="applied">Applied</option>
        <option value="skipped">Skipped</option>
      </select>
      <button id="refresh">⟳</button>
      <label class="muted"><input type="checkbox" id="hide-masked" /> hide applied/skipped on page</label>
    </div>
    <div id="list"><div class="empty">Loading…</div></div>
    <script src="popup.js"></script>
  </body>
</html>
