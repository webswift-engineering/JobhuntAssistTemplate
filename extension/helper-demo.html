<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobHunt field helper — demo</title>
    <style>
      body { font: 16px/1.45 -apple-system, system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #1c1c1e; background: #f2f2f7; }
      h1 { font-size: 22px; }
      .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
      label { display: block; font-size: 13px; color: #8e8e93; margin: 14px 0 4px; }
      input, button { font: inherit; }
      input[type=text], input[type=email], input[type=tel], input[type=password] {
        width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d1d6;
      }
      .row { display: flex; gap: 8px; margin-top: 18px; }
      button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #007aff; color: #fff; }
      button.ghost { background: #e5e5ea; color: #1c1c1e; }
      .muted { color: #8e8e93; font-size: 13px; }
      #step2 { display: none; }
    </style>
  </head>
  <body>
    <h1>Fake job site</h1>
    <p class="muted">Login and Next are yours. Focus a box for presets. Click Upload for the résumé.</p>
    <form class="card" id="step1" onsubmit="return false">
      <h2>Create an account</h2>
      <label>Email<input id="acct-email" type="email" autocomplete="username" /></label>
      <label>Password<input id="acct-pass" type="password" autocomplete="new-password" /></label>
      <div class="row">
        <button type="button" id="next">Next</button>
      </div>
    </form>
    <form class="card" id="step2" onsubmit="return false">
      <h2>Your info</h2>
      <label>Full name<input id="name" type="text" /></label>
      <label>Work email<input id="email" type="email" /></label>
      <label>Phone<input id="phone" type="tel" /></label>
      <label>Resume<input id="cv" type="file" accept=".pdf,.doc,.docx" /></label>
      <p class="muted" id="file-name"></p>
      <div class="row">
        <button type="button" class="ghost" disabled>Submit (always you)</button>
      </div>
    </form>
    <script src="applyCore.js"></script>
    <script src="assist.js"></script>
    <script>
      document.getElementById("next").onclick = () => {
        document.getElementById("step1").style.display = "none";
        document.getElementById("step2").style.display = "block";
      };
      document.getElementById("cv").addEventListener("change", (e) => {
        const f = e.target.files && e.target.files[0];
        document.getElementById("file-name").textContent = f ? "Attached: " + f.name : "";
      });
      window.JC_APPLY_ASSIST.mount({
        fields: {
          fullName: "Jane Roe",
          firstName: "Jane",
          lastName: "Roe",
          email: "jane@example.com",
          phone: "+1 416 555 0100",
          location: "Toronto, ON",
          linkedinUrl: "https://linkedin.com/in/janeroe",
          websiteUrl: "https://janeroe.dev",
          currentCompany: "Acme",
          currentTitle: "Staff Engineer",
          school: "University of Toronto",
          degree: "BSc",
          answers: { "years of go experience": "6" },
        },
        jobId: "demo",
        company: "Acme",
        title: "Staff Backend Engineer",
        resumeReady: true,
        resumeBase64: btoa("%PDF-1.4 demo resume"),
        resumeFilename: "Jane-Roe-Acme.pdf",
      });
    </script>
  </body>
</html>
